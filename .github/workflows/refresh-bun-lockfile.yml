name: Refresh Bun Lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: refresh-bun-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Verify patched TanStack Start
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          react_start="$(bun pm ls | sed -n 's/.*@tanstack\/react-start@\([^ ]*\).*/\1/p' | head -n1)"
          server_core="$(bun pm ls --all | sed -n 's/.*@tanstack\/start-server-core@\([^ ]*\).*/\1/p' | head -n1)"
          test "$react_start" = "1.168.60"
          node -e 'const v=process.argv[1].split(".").map(Number),m=[1,169,39]; if(v[0]<m[0]||(v[0]===m[0]&&v[1]<m[1])||(v[0]===m[0]&&v[1]===m[1]&&v[2]<m[2])) process.exit(1)' "$server_core"
          echo "Verified @tanstack/react-start@$react_start and @tanstack/start-server-core@$server_core"
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current."
            exit 0
          fi
          git config user.name "orbitfs-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh Bun lockfile for patched TanStack Start"
          git push origin HEAD:main
